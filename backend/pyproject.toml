[project]
name = "docmaster-backend"
version = "0.1.0"
description = "Papyra local document-generation backend (Tauri sidecar, JSON-RPC over stdio)"
requires-python = ">=3.12"
dependencies = ["python-docx==1.2.0", "docxtpl==0.20.2", "lxml>=6,<7", "pypdf>=6,<7", "PyYAML>=6,<7", "keyring>=25", "psutil>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docmaster*"]
